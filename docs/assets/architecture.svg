<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 636" width="1000" height="636" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b95a5"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1000" height="636" fill="#ffffff"/>

  <!-- Layer 1: 用户界面 -->
  <text x="40" y="40" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">① 用户界面</text>
  <rect x="40" y="54" width="920" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="62" y="76" width="180" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="152" y="102" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">① 简历画像</text>
  <text x="152" y="122" font-size="11" fill="#64748b" text-anchor="middle">上传 · 解析 · 对话确认</text>

  <rect x="262" y="76" width="180" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="352" y="102" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">② 岗位池</text>
  <text x="352" y="122" font-size="11" fill="#64748b" text-anchor="middle">导入 · 打分 · 去重</text>

  <rect x="462" y="76" width="200" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="562" y="102" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">③ 投递清单</text>
  <text x="562" y="122" font-size="11" fill="#3b82f6" text-anchor="middle">3 页签 · 你授权后才生效</text>

  <rect x="682" y="76" width="180" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="772" y="102" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">④ 跟踪仪表盘</text>
  <text x="772" y="122" font-size="11" fill="#64748b" text-anchor="middle">漏斗 · 面试 · 时间线</text>

  <text x="892" y="112" font-size="11" fill="#94a3b8" text-anchor="middle">单文件 SPA</text>
  <text x="892" y="130" font-size="11" fill="#94a3b8" text-anchor="middle">无构建步骤</text>

  <!-- arrow down -->
  <line x1="500" y1="158" x2="500" y2="196" stroke="#8b95a5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="512" y="182" font-size="11" fill="#64748b">Cloud SDK（认证 · 数据 · LLM）</text>

  <!-- Layer 2: 云服务 -->
  <text x="40" y="222" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">② 云服务（无自建后端）</text>
  <rect x="40" y="236" width="920" height="120" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="62" y="258" width="248" height="78" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="186" y="282" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">云数据库（4 张表 · 行级隔离）</text>
  <text x="186" y="304" font-size="11" fill="#475569" text-anchor="middle">profiles　jobs</text>
  <text x="186" y="322" font-size="11" fill="#475569" text-anchor="middle">job_events　agent_tasks</text>

  <rect x="330" y="258" width="200" height="78" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="282" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">免密钥 LLM</text>
  <text x="430" y="304" font-size="11" fill="#475569" text-anchor="middle">解析 · 画像 · JEV 打分</text>
  <text x="430" y="322" font-size="11" fill="#475569" text-anchor="middle">temperature 0.3 + JSON</text>

  <rect x="550" y="258" width="180" height="78" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="640" y="282" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">用户认证</text>
  <text x="640" y="304" font-size="11" fill="#475569" text-anchor="middle">OAuth 会话</text>
  <text x="640" y="322" font-size="11" fill="#475569" text-anchor="middle">auth.uid() 隔离键</text>

  <rect x="750" y="258" width="188" height="78" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="844" y="282" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">agent_tasks</text>
  <text x="844" y="304" font-size="11" fill="#9a3412" text-anchor="middle">请求队列 + 运行记录</text>
  <text x="844" y="322" font-size="11" fill="#9a3412" text-anchor="middle">pending → done / failed / merged</text>

  <!-- arrows: automation to cloud -->
  <line x1="470" y1="430" x2="470" y2="364" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="484" y="404" font-size="11" fill="#2563eb">写入：岗位 · 分数 · 事件 · 运行状态</text>

  <!-- Layer 3: 定时任务 -->
  <text x="40" y="424" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">③ 定时任务（Agent 侧）</text>
  <rect x="40" y="438" width="420" height="122" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="62" y="466" font-size="13" font-weight="700" fill="#1d4ed8">① 08:00　采集 + 打分</text>
  <text x="62" y="488" font-size="13" font-weight="700" fill="#1d4ed8">② 18:00　采集 + 打分</text>
  <text x="62" y="514" font-size="11" fill="#3b82f6">全状态查重 · 入库 · JEV 五维打分 · 登记运行记录</text>
  <text x="62" y="536" font-size="11" fill="#3b82f6">防重复补跑守卫：90 分钟内已在跑则静默退出</text>

  <rect x="480" y="438" width="480" height="122" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="502" y="466" font-size="13" font-weight="700" fill="#15803d">③ 每小时　看门狗 + 消费手动请求</text>
  <text x="502" y="490" font-size="11" fill="#166534">· 超过 2 小时仍 processing → 标 failed（失败原因：运行超时）</text>
  <text x="502" y="512" font-size="11" fill="#166534">· 取 collect_now / pending → 执行一轮手动采集</text>
  <text x="502" y="534" font-size="11" fill="#166534">· 重复点击 → 合并为一轮（merged）</text>

  <!-- Layer 4: 采集通道 -->
  <text x="40" y="606" font-size="12" fill="#94a3b8">采集通道</text>
  <rect x="120" y="590" width="330" height="26" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="285" y="607" font-size="11" fill="#334155" text-anchor="middle">猎聘：无头浏览器抓卡片（本机直连，无需代理）</text>
  <rect x="470" y="590" width="490" height="26" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="715" y="607" font-size="11" fill="#b91c1c" text-anchor="middle">领英：用户真实 Edge + 代理门禁（不满足条件直接跳过，绝不直连抓取）</text>

  <line x1="250" y1="562" x2="250" y2="584" stroke="#8b95a5" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="720" y1="562" x2="720" y2="584" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowWarn)"/>
</svg>
