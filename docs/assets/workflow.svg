<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="1000" height="650" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="20" font-weight="700" fill="#0f172a">投递助手 · 完整工作流（7 步）</text>
  <text x="40" y="68" font-size="12" fill="#64748b">阶段一一次性建画像，阶段二每天循环；标橙的 3 处是必须由你亲手完成的人机交界点</text>

  <!-- ============ Band 1 ============ -->
  <rect x="40" y="88" width="920" height="206" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="62" y="114" font-size="13" font-weight="700" fill="#475569" letter-spacing="0.5">阶段一 · 建画像（一次性，串行）</text>

  <!-- N1 local -->
  <rect x="62" y="132" width="232" height="98" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="236" y="146" width="44" height="18" rx="9" fill="#f1f5f9"/>
  <text x="258" y="159" font-size="10" fill="#475569" text-anchor="middle">本地</text>
  <text x="76" y="162" font-size="14" font-weight="700" fill="#0f172a">① 简历上传与解析</text>
  <text x="76" y="184" font-size="11" fill="#64748b">docx / pdf / md / txt / 图片</text>
  <text x="76" y="202" font-size="11" fill="#64748b">浏览器本地解析，原件不上传</text>

  <line x1="294" y1="181" x2="328" y2="181" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- N2 agent -->
  <rect x="334" y="132" width="232" height="98" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="508" y="146" width="44" height="18" rx="9" fill="#dbeafe"/>
  <text x="530" y="159" font-size="10" fill="#1d4ed8" text-anchor="middle">Agent</text>
  <text x="348" y="162" font-size="14" font-weight="700" fill="#1d4ed8">② 画像分析生成</text>
  <text x="348" y="184" font-size="11" fill="#3b82f6">免密钥 LLM + 结构化 schema</text>
  <text x="348" y="202" font-size="11" fill="#3b82f6">目标 / 关键词 / 优势 / 短板</text>

  <line x1="566" y1="181" x2="600" y2="181" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- N3 human -->
  <rect x="606" y="132" width="232" height="98" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <rect x="780" y="146" width="44" height="18" rx="9" fill="#ffedd5"/>
  <text x="802" y="159" font-size="10" fill="#c2410c" text-anchor="middle">你亲手</text>
  <text x="620" y="162" font-size="14" font-weight="700" fill="#c2410c">③ 对话微调 → 确认</text>
  <text x="620" y="184" font-size="11" fill="#9a3412">改城市 · 加关键词 · 调职级</text>
  <text x="620" y="202" font-size="11" fill="#9a3412">确认后前 3 步不再循环</text>

  <line x1="838" y1="181" x2="844" y2="181" stroke="#15803d" stroke-width="2" marker-end="url(#arOk)"/>

  <!-- badge -->
  <rect x="850" y="156" width="88" height="52" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="894" y="178" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">画像固化</text>
  <text x="894" y="195" font-size="9" fill="#15803d" text-anchor="middle">confirmed=true</text>

  <text x="62" y="256" font-size="11" fill="#64748b">判据：profiles.confirmed = true —— 未确认前，第 4 步的采集任务不会启动</text>
  <text x="62" y="276" font-size="11" fill="#64748b">重新走流程：旧画像置 is_active = false，历史岗位与事件全部保留</text>

  <!-- ============ Divider ============ -->
  <line x1="40" y1="317" x2="960" y2="317" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 5"/>
  <rect x="392" y="306" width="216" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="500" y="321" font-size="11" fill="#64748b" text-anchor="middle">阶段一结束 · 之后不再重复</text>

  <!-- ============ Band 2 ============ -->
  <rect x="40" y="336" width="920" height="246" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="62" y="362" font-size="13" font-weight="700" fill="#475569" letter-spacing="0.5">阶段二 · 日常循环（每天 08:00 / 18:00）</text>

  <!-- N4 agent -->
  <rect x="62" y="380" width="195" height="98" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="199" y="394" width="44" height="18" rx="9" fill="#dbeafe"/>
  <text x="221" y="407" font-size="10" fill="#1d4ed8" text-anchor="middle">Agent</text>
  <text x="76" y="410" font-size="13.5" font-weight="700" fill="#1d4ed8">④ 岗位采集入库</text>
  <text x="76" y="432" font-size="11" fill="#3b82f6">猎聘 3 词 + 领英 3 词</text>
  <text x="76" y="450" font-size="11" fill="#3b82f6">全状态查重后才写入 jobs</text>

  <line x1="257" y1="429" x2="283" y2="429" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- N5 agent -->
  <rect x="289" y="380" width="195" height="98" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="426" y="394" width="44" height="18" rx="9" fill="#dbeafe"/>
  <text x="448" y="407" font-size="10" fill="#1d4ed8" text-anchor="middle">Agent</text>
  <text x="303" y="410" font-size="13.5" font-weight="700" fill="#1d4ed8">⑤ JEV 自动打分</text>
  <text x="303" y="432" font-size="11" fill="#3b82f6">五维加权，硬冲突 &lt;50</text>
  <text x="303" y="450" font-size="11" fill="#3b82f6">只依据画像里的真实经历</text>

  <line x1="484" y1="429" x2="510" y2="429" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- N6 human -->
  <rect x="516" y="380" width="195" height="98" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <rect x="653" y="394" width="44" height="18" rx="9" fill="#ffedd5"/>
  <text x="675" y="407" font-size="10" fill="#c2410c" text-anchor="middle">你亲手</text>
  <text x="530" y="410" font-size="13.5" font-weight="700" fill="#c2410c">⑥ 投递清单确认</text>
  <text x="530" y="432" font-size="11" fill="#9a3412">3 页签 · 各带数量角标</text>
  <text x="530" y="450" font-size="11" fill="#9a3412">勾选授权，你本人去投</text>

  <line x1="711" y1="429" x2="737" y2="429" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- N7 agent -->
  <rect x="743" y="380" width="195" height="98" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="880" y="394" width="44" height="18" rx="9" fill="#dbeafe"/>
  <text x="902" y="407" font-size="10" fill="#1d4ed8" text-anchor="middle">Agent</text>
  <text x="757" y="410" font-size="13.5" font-weight="700" fill="#1d4ed8">⑦ 投递跟踪</text>
  <text x="757" y="432" font-size="11" fill="#3b82f6">漏斗 · 面试 · 时间线</text>
  <text x="757" y="450" font-size="11" fill="#3b82f6">每次变更写 job_events</text>

  <!-- loop back -->
  <path d="M840,478 V512 H159 V484" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arLoop)"/>
  <rect x="428" y="503" width="144" height="18" fill="#f8fafc"/>
  <text x="500" y="516" font-size="11" fill="#15803d" text-anchor="middle">↻ 下一轮，回到第 4 步</text>

  <text x="62" y="546" font-size="11" fill="#64748b">定时：08:00 / 18:00 采集 + 打分　·　每小时看门狗消费手动请求　·　09:30 / 19:30 同步投递反馈</text>
  <text x="62" y="566" font-size="11" fill="#64748b">去重：与库内「待确认 / 待投递 / 已查看 / 已投递 / 不合适」全状态比对，命中即跳过，绝不重复入库</text>

  <!-- ============ Legend ============ -->
  <rect x="40" y="606" width="12" height="12" rx="3" fill="#2563eb"/>
  <text x="58" y="616" font-size="11" fill="#475569">Agent 自动执行</text>
  <rect x="168" y="606" width="12" height="12" rx="3" fill="#fb923c"/>
  <text x="186" y="616" font-size="11" fill="#475569">你亲手完成（人机交界）</text>
  <rect x="356" y="606" width="12" height="12" rx="3" fill="#cbd5e1"/>
  <text x="374" y="616" font-size="11" fill="#475569">浏览器本地处理</text>
  <text x="520" y="616" font-size="11" font-weight="700" fill="#b91c1c">任何环节 Agent 都不会代你点击投递</text>
</svg>
